<svg xmlns="http://www.w3.org/2000/svg" viewBox="-20 -20 500 340" width="500" height="340" role="img" aria-label="Diagram: a document folder with a structure manifest, validated against its document class, created in IFS, uploaded and attached to a business object, with a per-row run log" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs><linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF"></stop><stop offset="1" stop-color="#F8F5FC"></stop></linearGradient></defs><rect x="-20" y="-20" width="500" height="340" fill="url(#bgGrad)"></rect>
  

          <text x="14" y="16" font-size="9" fill="#54446A" class="code">SOURCE FOLDER</text>

          <rect x="14" y="24" width="128" height="122" fill="#FFFFFF" stroke="#CDBFE0"></rect>
          <g class="code" font-size="8.5" fill="#3A2C4E">
            <text x="26" y="44" fill="#007F67">manifest.csv</text>
            <text x="26" y="64">DRW-10041.pdf</text>
            <text x="26" y="80">DRW-10042.pdf</text>
            <text x="26" y="96">SPEC-2210.docx</text>
            <text x="26" y="112">CERT-88.png</text>
            <text x="26" y="132" fill="#54446A">+ 1 842 files</text>
          </g>

          <g fill="none" stroke="#3F57E0" stroke-width="1.4">
            <path class="flow" d="M142 84 H 194"></path>
            <path class="flow d2" d="M282 84 H 330"></path>
          </g>
          <circle class="pkt" r="2.6" fill="#007F67" style="offset-path:path('M142 84 H 194')"></circle>
          <circle class="pkt d3" r="2.6" fill="#007F67" style="offset-path:path('M282 84 H 330')"></circle>

          <rect class="stage" x="194" y="44" width="88" height="82" fill="#FFFFFF" stroke="#3F57E0"></rect>
          <text x="238" y="38" text-anchor="middle" font-size="9" fill="#3A2C4E" letter-spacing="1.2">VALIDATE</text>
          <g class="code" font-size="8" fill="#3A2C4E">
            <text x="204" y="64">class + format</text>
            <text x="204" y="80">revision</text>
            <text x="204" y="96">file present</text>
            <text x="204" y="114" fill="#007F67">document id</text>
          </g>

          <rect class="stage s2" x="330" y="44" width="116" height="82" fill="#FFFFFF" stroke="#007F67"></rect>
          <text x="388" y="38" text-anchor="middle" font-size="9" fill="#3A2C4E" letter-spacing="1.2">IFS CLOUD</text>
          <g class="code" font-size="8" fill="#3A2C4E">
            <text x="340" y="64">document created</text>
            <text x="340" y="80">file uploaded</text>
            <text x="340" y="96" fill="#007F67">attached to</text>
            <text x="340" y="112" fill="#007F67">Part catalogue</text>
          </g>

          <text x="14" y="168" font-size="9" fill="#54446A" class="code">MANIFEST ROW</text>
          <rect x="14" y="176" width="432" height="26" fill="#F1EBF8" stroke="#CDBFE0"></rect>
          <g class="code" font-size="8" fill="#3A2C4E">
            <text x="24" y="192">class = DRAWING</text>
            <text x="136" y="192">number = DRW-10041</text>
            <text x="248" y="192">revision = A1</text>
            <text x="300" y="192">attach to = Part</text>
          </g>

          <text x="14" y="226" font-size="9" fill="#54446A" class="code">RUN LOG</text>
          <g class="code" font-size="8">
            <g class="pop"><rect x="14" y="234" width="432" height="16" fill="#FFFFFF"></rect><text x="24" y="245" fill="#3A2C4E">1841 <tspan fill="#007F67">[INFO]</tspan> DRW-10041 migrated · Part GB-1120</text></g>
            <g class="pop d3"><rect x="14" y="252" width="432" height="16" fill="#FFFFFF"></rect><text x="24" y="263" fill="#3A2C4E">1842 <tspan fill="#007F67">[INFO]</tspan> SPEC-2210 migrated · file reference created</text></g>
            <g class="pop d5"><rect x="14" y="270" width="432" height="16" fill="#F1EBF8"></rect><text x="24" y="281" fill="#3A2C4E">1843 <tspan fill="#A85F00">[WARN]</tspan> CERT-88 · class not enabled for this format</text></g>
          </g>
        
</svg>