<svg xmlns="http://www.w3.org/2000/svg" viewBox="-20 -20 500 326" width="500" height="326" role="img" aria-label="Diagram: rows of a client CSV creating IAM clients with linked service users, and a result log recording created, skipped and disabled outcomes" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs><linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF"></stop><stop offset="1" stop-color="#F8F5FC"></stop></linearGradient></defs><rect x="-20" y="-20" width="500" height="326" fill="url(#bgGrad)"></rect>
  

          <text x="14" y="16" font-size="9" fill="#54446A" class="code">configuration sheet</text>
          <g class="code" font-size="8.5">
            <rect x="14" y="24" width="176" height="22" fill="#F1EBF8" stroke="#CDBFE0"></rect><text x="24" y="39" fill="#1E0B2E">WMS_INBOUND</text>
            <rect x="14" y="52" width="176" height="22" fill="#F1EBF8" stroke="#CDBFE0"></rect><text x="24" y="67" fill="#1E0B2E">EDI_ORDERS</text>
            <rect x="14" y="80" width="176" height="22" fill="#F1EBF8" stroke="#CDBFE0"></rect><text x="24" y="95" fill="#1E0B2E">TMS_TRACKING</text>
            <rect x="14" y="108" width="176" height="22" fill="#F1EBF8" stroke="#CDBFE0"></rect><text x="24" y="123" fill="#1E0B2E">SFDC_SYNC</text>
            <rect x="14" y="136" width="176" height="22" fill="#F1EBF8" stroke="#CDBFE0"></rect><text x="24" y="151" fill="#1E0B2E">BI_EXTRACT</text>
          </g>
          <g class="code" font-size="8" fill="#54446A">
            <text x="130" y="39">enabled</text>
            <text x="130" y="67">enabled</text>
            <text x="130" y="95">enabled</text>
            <text x="130" y="123">disabled</text>
            <text x="130" y="151">enabled</text>
          </g>

          <g fill="none" stroke="#3F57E0" stroke-width="1.3">
            <path class="flow" d="M190 35 C 220 35 226 78 250 86"></path>
            <path class="flow d1" d="M190 63 C 220 63 228 80 250 88"></path>
            <path class="flow d2" d="M190 91 H 250"></path>
            <path class="flow d3" d="M190 119 C 220 119 228 98 250 92"></path>
            <path class="flow d4" d="M190 147 C 220 147 226 100 250 94"></path>
          </g>
          <circle class="pkt" r="2.4" fill="#007F67" style="offset-path:path('M190 35 C 220 35 226 78 250 86')"></circle>
          <circle class="pkt d3" r="2.4" fill="#007F67" style="offset-path:path('M190 91 H 250')"></circle>

          <rect class="stage" x="250" y="58" width="126" height="64" fill="#FFFFFF" stroke="#007F67"></rect>
          <text x="313" y="52" text-anchor="middle" font-size="9" fill="#3A2C4E" letter-spacing="1.2">IFS IAM</text>
          <g class="code" font-size="8" fill="#3A2C4E">
            <text x="260" y="78">client registered</text>
            <text x="260" y="94" fill="#007F67">service user linked</text>
            <text x="260" y="110">state applied</text>
          </g>

          <text x="14" y="186" font-size="9" fill="#54446A" class="code">RESULT LOG</text>
          <g class="code" font-size="8">
            <g class="pop"><rect x="14" y="194" width="432" height="16" fill="#FFFFFF"></rect><text x="24" y="205" fill="#3A2C4E">WMS_INBOUND <tspan fill="#007F67">[INFO]</tspan> client created, service user linked</text></g>
            <g class="pop d2"><rect x="14" y="212" width="432" height="16" fill="#FFFFFF"></rect><text x="24" y="223" fill="#3A2C4E">EDI_ORDERS <tspan fill="#007F67">[INFO]</tspan> client created</text></g>
            <g class="pop d4"><rect x="14" y="230" width="432" height="16" fill="#F1EBF8"></rect><text x="24" y="241" fill="#3A2C4E">SFDC_SYNC <tspan fill="#A85F00">[WARN]</tspan> already exists, left unchanged</text></g>
            <g class="pop d6"><rect x="14" y="248" width="432" height="16" fill="#FFFFFF"></rect><text x="24" y="259" fill="#3A2C4E">BI_EXTRACT <tspan fill="#007F67">[INFO]</tspan> client created, disabled as declared</text></g>
          </g>
        
</svg>