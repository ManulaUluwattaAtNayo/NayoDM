<svg xmlns="http://www.w3.org/2000/svg" viewBox="-20 -20 600 360" width="600" height="360" role="img" aria-label="Diagram: Excel, CSV, IFS Cloud and IFS IEE sources flow through field mapping and pre-flight validation into IFS Cloud" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs><linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF"></stop><stop offset="1" stop-color="#F8F5FC"></stop></linearGradient></defs><rect x="-20" y="-20" width="600" height="360" fill="url(#bgGrad)"></rect>
  

          <defs>
            <linearGradient id="hgFlow" x1="0" y1="0" x2="1" y2="0">
              <stop offset="0" stop-color="#3F57E0"></stop><stop offset="1" stop-color="#007F67"></stop>
            </linearGradient>
            <filter id="hgGlow" x="-50%" y="-50%" width="200%" height="200%">
              <feGaussianBlur stdDeviation="5" result="b"></feGaussianBlur>
              <feMerge><feMergeNode in="b"></feMergeNode><feMergeNode in="SourceGraphic"></feMergeNode></feMerge>
            </filter>
          </defs>

          <g class="code" font-size="11" fill="#1E0B2E">
            <rect x="6" y="26" width="108" height="32" rx="2" fill="#F1EBF8" stroke="#CDBFE0"></rect><text x="20" y="46">Excel .xlsx</text>
            <rect x="6" y="86" width="108" height="32" rx="2" fill="#F1EBF8" stroke="#CDBFE0"></rect><text x="20" y="106">CSV</text>
            <rect x="6" y="146" width="108" height="32" rx="2" fill="#F1EBF8" stroke="#CDBFE0"></rect><text x="20" y="166">IFS Cloud</text>
            <rect x="6" y="206" width="108" height="32" rx="2" fill="#F1EBF8" stroke="#CDBFE0"></rect><text x="20" y="226">IFS IEE</text>
          </g>

          <g fill="none" stroke="#3F57E0" stroke-width="1.6" opacity="0.85">
            <path class="flow" d="M114 42 C 152 42 154 96 186 118"></path>
            <path class="flow d1" d="M114 102 C 152 102 156 110 186 124"></path>
            <path class="flow d2" d="M114 162 C 152 162 156 148 186 136"></path>
            <path class="flow d3" d="M114 222 C 152 222 154 168 186 142"></path>
          </g>

          <rect class="stage s2" x="186" y="88" width="104" height="86" rx="2" fill="#FFFFFF" stroke="#3F57E0"></rect>
          <text x="238" y="80" text-anchor="middle" font-size="10" fill="#3A2C4E" letter-spacing="1.6">MAP</text>
          <g fill="#3F57E0">
            <circle cx="199" cy="110" r="2.5"></circle><circle cx="199" cy="131" r="2.5"></circle><circle cx="199" cy="152" r="2.5"></circle>
          </g>
          <g stroke="#3F57E0" stroke-width="1.2" fill="none">
            <path class="draw" d="M204 110 H 272"></path>
            <path class="draw d2" d="M204 131 H 272"></path>
            <path class="draw d4" d="M204 152 H 272"></path>
          </g>
          <g fill="#007F67">
            <circle cx="277" cy="110" r="2.5"></circle><circle cx="277" cy="131" r="2.5"></circle><circle cx="277" cy="152" r="2.5"></circle>
          </g>
          <g class="code" font-size="8">
            <text x="186" y="196" fill="#3A2C4E">CUSTOMER_NO <tspan fill="#54446A">→</tspan> <tspan fill="#007F67">CustomerId</tspan></text>
            <text x="186" y="210" fill="#3A2C4E">CREATED <tspan fill="#54446A">→</tspan> <tspan fill="#007F67">DateEntered</tspan></text>
            <text x="186" y="224" fill="#54446A">+ 26 fields mapped</text>
          </g>

          <path class="flow" d="M290 131 H 334" fill="none" stroke="url(#hgFlow)" stroke-width="1.8"></path>

          <rect class="stage s3" x="334" y="78" width="98" height="106" rx="2" fill="#FFFFFF" stroke="#007F67"></rect>
          <text x="383" y="70" text-anchor="middle" font-size="10" fill="#3A2C4E" letter-spacing="1.6">PRE-FLIGHT</text>
          <g class="code" font-size="8">
            <rect x="344" y="88" width="78" height="14" fill="#F1EBF8"></rect><circle cx="352" cy="95" r="3" fill="#007F67"></circle><text x="361" y="98" fill="#3A2C4E">type</text>
            <g class="pulse d1"><rect x="344" y="106" width="78" height="14" fill="#F1EBF8"></rect><circle cx="352" cy="113" r="3" fill="#007F67"></circle><text x="361" y="116" fill="#3A2C4E">length</text></g>
            <g class="pulse d2"><rect x="344" y="124" width="78" height="14" fill="#F1EBF8"></rect><circle cx="352" cy="131" r="3" fill="#A85F00"></circle><text x="361" y="134" fill="#3A2C4E">warnings</text></g>
            <g class="pulse d3"><rect x="344" y="142" width="78" height="14" fill="#F1EBF8"></rect><circle cx="352" cy="149" r="3" fill="#007F67"></circle><text x="361" y="152" fill="#3A2C4E">required</text></g>
            <g class="pulse d4"><rect x="344" y="160" width="78" height="14" fill="#F1EBF8"></rect><circle cx="352" cy="167" r="3" fill="#007F67"></circle><text x="361" y="170" fill="#3A2C4E">date fmt</text></g>
          </g>

          <path class="flow" d="M432 131 H 468" fill="none" stroke="#007F67" stroke-width="1.8"></path>
          <g fill="#007F67">
            <circle class="pkt" r="3" style="offset-path:path('M114 42 C 152 42 154 96 186 118')"></circle>
            <circle class="pkt d3" r="3" style="offset-path:path('M114 162 C 152 162 156 148 186 136')"></circle>
            <circle class="pkt d5" r="3" style="offset-path:path('M290 131 H 334')"></circle>
            <circle class="pkt d7" r="3.4" style="offset-path:path('M432 131 H 468')"></circle>
          </g>

          <g filter="url(#hgGlow)">
            <ellipse cx="506" cy="96" rx="42" ry="12" fill="#007F67" fill-opacity="0.16" stroke="#007F67"></ellipse>
            <path class="accept" d="M464 96 V 166 C 464 173 483 179 506 179 C 529 179 548 173 548 166 V 96" fill="#007F67" fill-opacity="0.07" stroke="#007F67"></path>
            <ellipse cx="506" cy="166" rx="42" ry="12" fill="none" stroke="#007F67" stroke-opacity="0.5"></ellipse>
          </g>
          <text x="506" y="200" text-anchor="middle" font-size="11" fill="#1E0B2E">IFS Cloud</text>
          <text x="506" y="215" text-anchor="middle" font-size="9" fill="#54446A" class="code">migration entities</text>

          <g fill="#007F67">
            <rect class="rise" x="500" y="240" width="12" height="3"></rect>
            <rect class="rise d2" x="484" y="240" width="12" height="3"></rect>
            <rect class="rise d4" x="516" y="240" width="12" height="3"></rect>
          </g>

          <g class="code" font-size="9" fill="#54446A">
            <text x="6" y="292">batch 1 000</text>
            <text x="110" y="292">commit 50 000</text>
            <text x="230" y="292">0 errors</text>
            <text x="310" y="292" fill="#A85F00">3 warnings</text>
            <text x="420" y="292" fill="#007F67">streaming<tspan class="blink">_</tspan></text>
          </g>
          <rect x="6" y="300" width="548" height="3" fill="#F1EBF8"></rect>
          <rect class="fill-bar" x="6" y="300" width="548" height="3" fill="#007F67" fill-opacity="0.85"></rect>
        
</svg>